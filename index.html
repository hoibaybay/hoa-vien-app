<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hoa Viên Lovelygar</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f6fbf7;color:#173b28}
.header{position:sticky;top:0;z-index:5;background:#123f25;color:#fff;padding:16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px #0002}
.header h1{margin:0;font-size:26px}
.status{background:#1d5a35;padding:8px 14px;border-radius:24px;font-weight:bold}
.container{padding:16px;max-width:1200px;margin:auto}
.tabs,.filters{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
button{border:2px solid #d7eadc;background:white;color:#4f7d5e;padding:10px 16px;border-radius:22px;font-weight:700;cursor:pointer}
button.active{background:#123f25;color:white;border-color:#123f25}
.search{width:100%;padding:15px;border-radius:12px;border:2px solid #d7eadc;font-size:18px;margin:8px 0 16px}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.sum-card{background:#fff;border:1px solid #d7eadc;border-radius:14px;padding:12px;text-align:center}
.sum-card b{font-size:22px;color:#e22891}
.section-title{color:#e22891;font-size:24px;font-weight:800;margin:14px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:#fff;border:2px solid #d7eadc;border-radius:18px;overflow:hidden;box-shadow:0 3px 8px #0000000d}
.thumb{height:130px;background:linear-gradient(135deg,#dff7ff,#ffe2f2);display:flex;align-items:center;justify-content:center;font-size:52px}
.card-body{padding:13px}
.card h3{margin:0 0 8px;color:#e22891;font-size:19px;line-height:1.25}
.tag{display:inline-block;background:#ffe5f3;color:#d82789;padding:5px 10px;border-radius:14px;font-weight:700;margin:3px 3px 3px 0;font-size:13px}
.member{background:#dff3ff;color:#1675a1}
.group{background:#eee7ff;color:#6e42c1}
.owner-box{margin-top:8px;min-height:34px}
.add-row{display:flex;gap:6px;margin-top:10px}
.add-row input{flex:1;padding:9px;border:1px solid #cde2d2;border-radius:10px}
.add-row button{padding:8px 10px;border-radius:10px;background:#e22891;color:#fff;border:none}
.tools{background:#fff;border:1px solid #d7eadc;border-radius:14px;padding:12px;margin-bottom:14px}
.tools button{margin:4px}
.small{font-size:13px;color:#63816c}
@media(max-width:700px){
  .summary{grid-template-columns:repeat(2,1fr)}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .thumb{height:105px;font-size:42px}
  .card h3{font-size:16px}
  button{padding:9px 12px}
}
</style>
</head>
<body>

<div class="header">
  <h1>🌺 Hoa Viên</h1>
  <div class="status">🟢 Ai cũng có thể thêm tên</div>
</div>

<div class="container">
  <div class="tools">
    <b>Dữ liệu hoa từ file Excel:</b> <span id="totalText"></span>
    <div class="small">Bấm “+” ở từng hoa để thêm thành viên. Dữ liệu lưu online bằng Firebase Firestore, mọi người cùng thấy realtime.</div>
    <button onclick="exportData()">📤 Xuất dữ liệu JSON</button>
    <button onclick="resetData()">♻️ Khôi phục dữ liệu gốc</button>
  </div>

  <div class="tabs">
    <button class="active" onclick="setTab('all',this)">🌸 Hoa</button>
    <button onclick="setTab('marked',this)">✅ Đánh dấu</button>
  </div>

  <div class="filters">
    <button class="active" onclick="filterFlower('all',this)">Tất cả</button>
    <button onclick="filterFlower('Hoa Lv 40-60',this)">Lv 40-60</button>
    <button onclick="filterFlower('Hoa phẩm xanh dương',this)">🔵 Xanh dương</button>
    <button onclick="filterFlower('Hoa phẩm Tím',this)">🟣 Tím</button>
    <button onclick="filterFlower('Hoa phẩm Cam',this)">🟠 Cam</button>
    <button onclick="filterFlower('Hoa phẩm Hồng',this)">🌸 Hồng</button>
  </div>

  <input class="search" id="searchInput" placeholder="🔍 Tìm tên hoa hoặc thành viên..." oninput="renderFlowers()" />

  <div class="summary" id="summary"></div>
  <div class="section-title" id="sectionTitle">Tất cả hoa</div>
  <div class="grid" id="flowerGrid"></div>
</div>

let flowers = structuredClone(DEFAULT_FLOWERS);
let currentFilter = "all";
let currentTab = "all";
let firebaseReady = false;

async function seedMissingFlowers(){
  const snap = await getDocs(flowersRef);
  const existingIds = new Set();

  snap.forEach(d => {
    const data = d.data();
    if (typeof data.id === "number") existingIds.add(data.id);
  });

  const missing = DEFAULT_FLOWERS.filter(f => !existingIds.has(f.id));
  if (!missing.length) return;

  let batch = writeBatch(db);
  let count = 0;

  for (const flower of missing) {
    batch.set(flowerDoc(flower.id), { ...flower }, { merge: true });
    count++;

    if (count % 450 === 0) {
      await batch.commit();
      batch = writeBatch(db);
    }
  }

  await batch.commit();
}

function startRealtime(){
  onSnapshot(flowersRef, (snapshot) => {
    const onlineFlowers = [];

    snapshot.forEach(d => {
      const data = d.data();
      if (typeof data.id === "number" && data.name) {
        onlineFlowers.push({
          ...data,
          owners: Array.isArray(data.owners) ? data.owners : [],
          marked: !!data.marked
        });
      }
    });

    if (onlineFlowers.length) {
      flowers = onlineFlowers.sort((a, b) => a.id - b.id);
      firebaseReady = true;
      document.querySelector(".status").innerText = "🟢 Firebase realtime";
      renderFlowers();
    }
  }, (error) => {
    console.error(error);
    document.querySelector(".status").innerText = "🔴 Lỗi Firebase";
    alert("Không kết nối được Firebase. Kiểm tra Rules hoặc mạng.");
  });
}

async function saveFlower(flower){
  await setDoc(flowerDoc(flower.id), { ...flower }, { merge: true });
}

function setTab(tab, btn){
  currentTab = tab;
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  renderFlowers();
}

function filterFlower(category, btn){
  currentFilter = category;
  document.querySelectorAll(".filters button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  renderFlowers();
}

async function markFlower(id){
  const f = flowers.find(x=>x.id===id);
  if(!f) return;
  f.marked = !f.marked;
  renderFlowers();
  await updateDoc(flowerDoc(id), { marked: f.marked });
}

async function addOwner(id){
  const input = document.getElementById("owner-"+id);
  const name = input.value.trim();
  if(!name) return alert("Nhập tên thành viên cần thêm");

  const f = flowers.find(x=>x.id===id);
  if(!f) return;

  const owners = Array.isArray(f.owners) ? [...f.owners] : [];
  const exists = owners.some(o => o.toLowerCase() === name.toLowerCase());

  if(!exists) owners.push(name);
  input.value = "";

  f.owners = owners;
  renderFlowers();
  await saveFlower(f);
}

async function removeOwner(id, owner){
  const f = flowers.find(x=>x.id===id);
  if(!f) return;

  if(confirm("Xóa thành viên " + owner + " khỏi hoa này?")){
    f.owners = f.owners.filter(o => o !== owner);
    renderFlowers();
    await saveFlower(f);
  }
}

function renderSummary(list){
  const counts = {};
  flowers.forEach(f=>counts[f.category]=(counts[f.category]||0)+1);
  document.getElementById("totalText").innerText = flowers.length + " hoa";
  document.getElementById("summary").innerHTML = `
    <div class="sum-card"><b>${flowers.length}</b><br>Tổng hoa</div>
    <div class="sum-card"><b>${counts["Hoa phẩm xanh dương"]||0}</b><br>Xanh dương</div>
    <div class="sum-card"><b>${counts["Hoa phẩm Tím"]||0}</b><br>Tím</div>
    <div class="sum-card"><b>${counts["Hoa phẩm Cam"]||0}</b><br>Cam</div>
  `;
}

function renderFlowers(){
  const grid = document.getElementById("flowerGrid");
  const keyword = document.getElementById("searchInput").value.toLowerCase().trim();

  let result = flowers.filter(item => {
    const matchCategory = currentFilter === "all" || item.category === currentFilter;
    const matchSearch =
      item.name.toLowerCase().includes(keyword) ||
      item.category.toLowerCase().includes(keyword) ||
      item.owners.join(" ").toLowerCase().includes(keyword);
    const matchTab = currentTab === "all" || item.marked;
    return matchCategory && matchSearch && matchTab;
  });

  document.getElementById("sectionTitle").innerText =
    (currentTab === "marked" ? "Đã đánh dấu - " : "") +
    (currentFilter === "all" ? "Tất cả hoa" : currentFilter) +
    ` (${result.length})`;

  renderSummary(result);
  grid.innerHTML = result.map(item => `
    <div class="card">
      <div class="thumb">🌸</div>
      <div class="card-body">
        <h3>${escapeHtml(item.name)} ${item.level ? "Lv"+item.level : ""}</h3>
        <span class="tag group">🏅 ${escapeHtml(item.category)}</span>
        <span class="tag">${item.owners.length} thành viên</span>
        <button onclick="markFlower(${item.id})">${item.marked ? "⭐ Bỏ" : "☆ Đánh dấu"}</button>
        <div class="owner-box">
          ${item.owners.length ? item.owners.map(o =>
            `<span class="tag member" onclick="removeOwner(${item.id}, '${escapeAttr(o)}')" title="Bấm để xóa">👤 ${escapeHtml(o)}</span>`
          ).join("") : `<span class="small">Chưa có thành viên</span>`}
        </div>
        <div class="add-row">
          <input id="owner-${item.id}" placeholder="Thêm tên thành viên..." onkeydown="if(event.key==='Enter') addOwner(${item.id})">
          <button onclick="addOwner(${item.id})">+</button>
        </div>
      </div>
    </div>
  `).join("");
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){
  return escapeHtml(str).replace(/`/g, "&#96;");
}

function exportData(){
  const blob = new Blob([JSON.stringify(flowers, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "hoa-vien-data.json";
  a.click();
}

async function resetData(){
  if(confirm("Khôi phục dữ liệu gốc từ Excel? Các tên vừa thêm trên Firebase sẽ mất.")){
    document.querySelector(".status").innerText = "⏳ Đang khôi phục...";
    flowers = structuredClone(DEFAULT_FLOWERS);
    renderFlowers();

    let batch = writeBatch(db);
    let count = 0;

    for (const flower of DEFAULT_FLOWERS) {
      batch.set(flowerDoc(flower.id), { ...flower }, { merge: false });
      count++;
      if (count % 450 === 0) {
        await batch.commit();
        batch = writeBatch(db);
      }
    }

    await batch.commit();
    document.querySelector(".status").innerText = "🟢 Firebase realtime";
  }
}

async function initApp(){
  renderFlowers();
  document.querySelector(".status").innerText = "⏳ Đang kết nối Firebase...";
  try {
    await seedMissingFlowers();
    startRealtime();
  } catch (error) {
    console.error(error);
    document.querySelector(".status").innerText = "🔴 Lỗi Firebase";
    alert("Lỗi Firebase: " + error.message);
  }
}

window.setTab = setTab;
window.filterFlower = filterFlower;
window.markFlower = markFlower;
window.addOwner = addOwner;
window.removeOwner = removeOwner;
window.exportData = exportData;
window.resetData = resetData;
window.renderFlowers = renderFlowers;

initApp();
</script>
